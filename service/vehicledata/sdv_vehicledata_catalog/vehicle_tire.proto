syntax = "proto3";

package har.vehicledata;

import "syntax/vsidl.proto";

enum Location {
  option (sdv.vsidl.is_topic) = true;
  FRONT_LEFT = 0;
  FRONT_RIGHT = 1;
  REAR_LEFT = 2;
  REAR_RIGHT = 3;
  FIFTH_WHEEL = 4;
}

message TirePressure {
  option (sdv.vsidl.topic) = {
    typed_name: "Location"
  };

  uint32 pressure = 1;
}

message TireTemperature {
  option (sdv.vsidl.topic) = {
    typed_name: "Location"
  };

  uint32 temperature = 1;
}